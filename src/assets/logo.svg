<svg width="200" height="60" viewBox="0 0 200 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Main Logo Container with sophisticated design -->
  <g transform="translate(30, 30)">
    <!-- Outer ring with tech pattern -->
    <circle cx="0" cy="0" r="26" fill="url(#outerGradient)" opacity="0.1"/>
    <circle cx="0" cy="0" r="24" fill="none" stroke="url(#blueGradient)" stroke-width="1" opacity="0.3"/>
    
    <!-- Main background circle -->
    <circle cx="0" cy="0" r="22" fill="url(#blueGradient)" />
    
    <!-- Geometric tech pattern overlay -->
    <g opacity="0.2">
      <path d="M-15 -15 L15 15 M15 -15 L-15 15" stroke="url(#lightBlue)" stroke-width="0.5"/>
      <circle cx="-10" cy="-10" r="2" fill="url(#lightBlue)"/>
      <circle cx="10" cy="-10" r="2" fill="url(#lightBlue)"/>
      <circle cx="-10" cy="10" r="2" fill="url(#lightBlue)"/>
      <circle cx="10" cy="10" r="2" fill="url(#lightBlue)"/>
    </g>
    
    <!-- Central logo design - Abstract "E" with circuit/tech elements -->
    <g>
      <!-- Main stylized E with modern design -->
      <path d="M-10 -12 L6 -12 L6 -8 L-6 -8 L-6 -2 L4 -2 L4 2 L-6 2 L-6 8 L6 8 L6 12 L-10 12 Z" 
            fill="white" opacity="0.95"/>
      
      <!-- Tech circuit elements -->
      <g stroke="white" stroke-width="1.5" fill="none" opacity="0.8">
        <!-- Horizontal circuits -->
        <path d="M6 -10 L12 -10 L14 -8">
          <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
        </path>
        <path d="M4 0 L10 0 L12 2">
          <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite" begin="1s"/>
        </path>
        <path d="M6 10 L12 10 L14 8">
          <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite" begin="2s"/>
        </path>
      </g>
      
      <!-- Data flow dots -->
      <g fill="white">
        <circle cx="12" cy="-10" r="1.2">
          <animate attributeName="r" values="1;1.5;1" dur="2s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="10" cy="0" r="1">
          <animate attributeName="r" values="0.8;1.3;0.8" dur="2s" repeatCount="indefinite" begin="0.7s"/>
          <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" begin="0.7s"/>
        </circle>
        <circle cx="12" cy="10" r="1.2">
          <animate attributeName="r" values="1;1.5;1" dur="2s" repeatCount="indefinite" begin="1.3s"/>
          <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" begin="1.3s"/>
        </circle>
      </g>
      
      <!-- Corner accent elements -->
      <g fill="url(#accentBlue)" opacity="0.6">
        <polygon points="14,-6 16,-6 16,-4 14,-4"/>
        <polygon points="14,4 16,4 16,6 14,6"/>
        <circle cx="15" cy="0" r="0.8">
          <animate attributeName="opacity" values="0.4;0.8;0.4" dur="4s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>
  </g>
  
  <!-- Company Name with enhanced styling -->
  <text x="70" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="url(#textBlueGradient)">
    Ease
  </text>
  <text x="110" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1F2937">
    My
  </text>
  <text x="140" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="url(#textBlueGradient)">
    SaaS
  </text>
  
  <!-- Enhanced tagline -->
  <text x="70" y="40" font-family="Arial, sans-serif" font-size="10" font-weight="500" fill="#475569">
    Fixing Funnels, Fast.
  </text>
  
  <!-- Accent elements around text -->
  <g opacity="0.4">
    <circle cx="67" cy="22" r="1" fill="url(#accentBlue)">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="185" cy="22" r="1" fill="url(#accentBlue)">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite" begin="1.5s"/>
    </circle>
  </g>
  
  <!-- Gradient Definitions -->
  <defs>
    <!-- Primary blue gradient for logo -->
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E40AF;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#2563EB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
    </linearGradient>
    
    <!-- Outer ring gradient -->
    <linearGradient id="outerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    
    <!-- Light blue for accents -->
    <linearGradient id="lightBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#DBEAFE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#93C5FD;stop-opacity:1" />
    </linearGradient>
    
    <!-- Accent blue -->
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:1" />
    </linearGradient>
    
    <!-- Text gradient -->
    <linearGradient id="textBlueGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1E40AF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg> 